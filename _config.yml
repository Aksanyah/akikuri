title: AKIKURI
tagline: Pumpkin Spice Cyberpunk
description: >-
  AKIKURI — The Story of How I, an Autumn Christian Girl, Toppled the Tech
  Industry's Demon Kings and Became the World's Strongest Pumpkin Spice
  Cyberpunker. A new concept coming soon.
url: "https://akikuri.net"
baseurl: ""

# ---------------------------------------------------------------
# Shop link — the big "Visit the Etsy Store" button, and the
# fallback for any product with no url of its own.
# Individual listings live in _shop/*.md
# ---------------------------------------------------------------
etsy_shop: "https://www.etsy.com/shop/AksanyahStudios"

# ---------------------------------------------------------------
# Content collections. Each entry is one Markdown file:
#   _characters/*.md  -> the Characters grid
#   _shop/*.md        -> the Shop grid
# output: false means they are never published as standalone
# pages; they only render inside the grids on the home page.
# Cards are ordered by the "order:" value in their front matter.
# ---------------------------------------------------------------
collections:
  characters:
    output: false
  shop:
    output: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
